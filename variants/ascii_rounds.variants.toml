# Full-screen ASCII as the spike (#261) saw it in each round, on any scene:
# the first round's continuous ramp with no edges, the second round's banded
# tone over a wider footprint, and the second round's edges on top.
#
#   flint render phase4_runtime.scene.toml --variants variants/ascii_rounds.variants.toml -o tavern.png
#   flint render mesh_meadow.scene.toml    --variants variants/ascii_rounds.variants.toml -o meadow.png
#   flint render campfire.scene.toml       --variants variants/ascii_rounds.variants.toml -o campfire.png
#   flint render pbr_test.scene.toml       --variants variants/ascii_rounds.variants.toml -o pbr.png
#
# A --zoom on the command line adds to this file's (none here: where to look
# depends on the scene).

title = "ASCII: the spike's two rounds"

[[variant]]
label = "smooth"

[[variant]]
label = "round 1: continuous ramp"
flags = "--style ascii:levels=0,footprint=1,edges=0"

[[variant]]
label = "round 2: banded tone"
flags = "--style ascii:levels=4,footprint=2,edges=0"

[[variant]]
label = "round 2: and edges"
flags = "--style ascii:levels=4,footprint=2"
